[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "chaosproxy"
version = "0.1.0"
description = "Local HTTP traffic recorder, replay engine, and network chaos injector for resilient backend & frontend testing."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "ChaosProxy Contributors" }]
keywords = ["chaos-engineering", "mock-server", "http-proxy", "testing", "recorder", "replay", "resilience"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
    "Topic :: Internet :: Proxy Servers",
]
dependencies = [
    "httpx>=0.24.0",
    "starlette>=0.27.0",
    "uvicorn>=0.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]

[project.scripts]
chaosproxy = "chaosproxy.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["chaosproxy*"]
